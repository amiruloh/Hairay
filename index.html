<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Hair Card Texture Generator</title>
    <!-- Memanggil file CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="sidebar">
    <h2>Resolution</h2>
    <div class="res-container">
        <div style="flex: 1;">
            <label>Width</label>
            <input type="number" id="resWidth" value="512" step="128" min="128" max="4096">
        </div>
        <div style="flex: 1;">
            <label>Height</label>
            <input type="number" id="resHeight" value="1024" step="128" min="128" max="4096">
        </div>
    </div>
    <button id="applyResBtn" style="background:#607D8B; margin-top: 0; margin-bottom: 20px;">&#x1F4BE; Apply Resolution</button>

    <h2>Hair Parameters</h2>
    <div class="control-group">
        <label>Strand Count <span id="val-count" class="value-display">200</span></label>
        <input type="range" id="count" min="10" max="1000" value="200">
    </div>
    <div class="control-group">
        <label>Base Thickness <span id="val-thickness" class="value-display">4</span></label>
        <input type="range" id="thickness" min="1" max="15" value="4">
    </div>
    <div class="control-group">
        <label>Length Variaton <span id="val-length" class="value-display">80%</span></label>
        <input type="range" id="length" min="30" max="100" value="80">
    </div>
    <div class="control-group">
        <label>Direction (Bend) <span id="val-bend" class="value-display">0</span></label>
        <input type="range" id="bend" min="-150" max="150" value="0">
    </div>
    <div class="control-group">
        <label>Waviness <span id="val-wave" class="value-display">20</span></label>
        <input type="range" id="wave" min="0" max="100" value="20">
    </div>
    <div class="control-group">
        <label>Wave Frequency <span id="val-freq" class="value-display">3</span></label>
        <input type="range" id="freq" min="1" max="10" value="3">
    </div>
    <div class="control-group">
        <label>Spread (Width) <span id="val-spread" class="value-display">60</span></label>
        <input type="range" id="spread" min="10" max="500" value="60">
    </div>
    
    <h2>Appearance & Texture</h2>
    <div class="control-group">
        <label>Root Color</label>
        <input type="color" id="rootColor" value="#2a1508">
    </div>
    <div class="control-group">
        <label>Tip Color (Gradient)</label>
        <input type="color" id="tipColor" value="#a56b46">
    </div>
    <div class="control-group">
        <label>Color Variance (Highlights) <span id="val-variance" class="value-display">25</span></label>
        <input type="range" id="variance" min="0" max="100" value="25">
    </div>

    <button id="generateBtn">&#x1F3A8; Generate Hair</button>
    
    <br><br>
    <h2>Export</h2>
    <button id="downloadBtn" style="background:#2196F3">&#x1F4E5; Download Current Map</button>
</div>

<div id="main">
    <div class="tabs">
        <div class="tab active" data-map="alpha">Alpha (Opacity)</div>
        <div class="tab" data-map="color">Base Color</div>
        <div class="tab" data-map="height">Height Map</div>
        <div class="tab" data-map="normal">Normal Map</div>
        <div class="tab" data-map="ao">Ambient Occlusion</div>
        <div class="tab" data-map="root">Root-Tip Mask</div>
    </div>
    <canvas id="canvas" width="512" height="1024"></canvas>
</div>

<!-- Memanggil file JavaScript menggunakan ES6 Modules -->
<script type="module" src="js/app.js"></script>
</body>
</html>
